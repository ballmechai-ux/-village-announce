<style>
:root{color-scheme:light dark;--bg:#eef3ee;--card:#fff;--ink:#16231d;--mut:#586a60;--pri:#17795f;--pri2:#2a9f7d;--on:#fff;--line:#d3e0d7;--amber:#b4600a;--red:#c62828;--ok:#1b7a4a;--shadow:0 1px 2px rgba(20,50,35,.08),0 4px 14px rgba(20,50,35,.06)}

html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Sarabun,sans-serif}

button.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}

button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}

label{font-weight:600;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.item{cursor:pointer;border-left:6px solid var(--pri)}
.item.urgent{border-left-color:var(--amber)}
.item.emergency{border-left-color:var(--red)}
.item h3{font-size:20px}
.tag{display:inline-block;font-size:14px;padding:1px 10px;border-radius:99px;background:var(--line);margin-right:6px}
.tag.urgent{background:var(--amber);color:#fff}.tag.emergency{background:var(--red);color:#fff}
.meta{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.msg{padding:8px 0;border-bottom:1px solid var(--line)}

.row{display:flex;gap:8px}.row input{margin:0}
.center{text-align:center;padding:48px 8px}

.live{opacity:.7;border:1.5px dashed var(--line);background:transparent}

onAuthStateChanged(auth,async u=>{

  if(signingUp)return;
  if(!u)return showLogin();

});

function showError(e){
  show(h('div',{class:'card center'},h('h2',{},'เกิดข้อผิดพลาด'),h('p',{},e.message||String(e)),logoutBtn()));
}

const pwField=(ac,ph,max)=>{
  const input=h('input',{type:'password',autocomplete:ac,...(ph?{placeholder:ph}:{}),...(max?{maxlength:String(max)}:{})});
  const btn=h('button',{type:'button','aria-pressed':'false',class:'ghost sm',style:'white-space:nowrap',onclick:()=>{
    const show=input.type==='password';input.type=show?'text':'password';
    btn.textContent=show?'ซ่อน':'ดู';btn.setAttribute('aria-pressed',String(show))}},'ดู');
  return{input,row:h('div',{class:'row',style:'margin:4px 0 12px'},input,btn)};
};
const toEmail=p=>p.replace(/\D/g,'')+'@village-announce.app';
const okPhone=p=>/^0\d{8,9}$/.test(p.replace(/\D/g,''));
const authMsg=e=>({'auth/invalid-credential':'เบอร์หรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบเบอร์นี้ในระบบ','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/email-already-in-use':'เบอร์นี้สมัครแล้ว กรุณาเข้าสู่ระบบ','auth/weak-password':'รหัสผ่านต้องมี 6 ตัวพอดี','auth/too-many-requests':'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่','auth/operation-not-allowed':'ยังไม่ได้เปิดการสมัครด้วยอีเมล/รหัสผ่านใน Firebase','auth/popup-closed-by-user':'ปิดหน้าต่างก่อนเข้าสู่ระบบสำเร็จ'}[e.code]||('เกิดข้อผิดพลาด: '+(e.code||e.message)));

function showLogin(){
  const phone=h('input',{type:'tel',inputmode:'numeric',autocomplete:'username',placeholder:'0812345678'});
  const pwf=pwField('current-password'),pw=pwf.input;
  const err=h('p',{class:'err'});
  const go=async()=>{
    if(!okPhone(phone.value)){err.textContent='เบอร์โทรต้องขึ้นต้นด้วย 0 และมี 9–10 หลัก';return}
    try{await signInWithEmailAndPassword(auth,toEmail(phone.value),pw.value)}catch(e){err.textContent=authMsg(e)}
  };
  pw.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  show(h('div',{style:'padding:24px 0'},h('h1',{},'ประกาศหมู่บ้าน'),h('p',{class:'meta'},'รับข่าวสารจากผู้ใหญ่บ้านและคณะกรรมการ')),
    h('div',{class:'card'},
      h('label',{},'เบอร์โทร'),phone,h('label',{},'รหัสผ่าน'),pwf.row,
      h('button',{onclick:go},'เข้าสู่ระบบ'),err,
      h('p',{class:'meta'},'ยังไม่มีบัญชี?'),
      h('div',{class:'row'},
        h('button',{class:'ghost',onclick:showSignup},'สมัครใหม่'),
        h('button',{class:'ghost',onclick:async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){err.textContent=authMsg(e)}}},'ใช้ Google'))));
}

const TOKEN_URL='https://village-token.ballmechai.workers.dev';
const LK_SRC='https://cdn.jsdelivr.net/npm/livekit-client@2.5.0/dist/livekit-client.umd.min.js';
let livePeak=0,rec=null,recChunks=[],recT0=0,recEndAt=0,recMime='',recCap=null,pendingRec=null,liveAnnId=null,curLiveId=null,liveRoom=null,listenRoom=null,rxRoom=null,receiverOn=false,rxWant=false,rxBusy=false,wl=null;

const loadLK=()=>window.LivekitClient?Promise.resolve(window.LivekitClient):new Promise((ok,no)=>{
  const t=document.createElement('script');t.src=LK_SRC;
  t.onload=()=>ok(window.LivekitClient);t.onerror=()=>no(new Error('โหลดตัวเชื่อมเสียงไม่สำเร็จ ตรวจอินเทอร์เน็ต'));
  document.head.append(t);
});
async function getToken(mode){
  const idt=await user.getIdToken();
  const r=await fetch(TOKEN_URL,{method:'POST',headers:{Authorization:'Bearer '+idt,'Content-Type':'application/json'},body:JSON.stringify({mode})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error==='admin only'?'ใช้ได้เฉพาะแอดมิน':j.error==='not approved'?'ยังไม่ได้รับอนุมัติ':'ขอสิทธิ์เสียงไม่สำเร็จ ('+(j.error||r.status)+')');
  return j;
}
const liveOn=d=>!!d&&d.active===true&&(!d.startedAt?.toDate||Date.now()-d.startedAt.toDate().getTime()<3*3600*1000);
const offLive=()=>setDoc(doc(db,'live','current'),{active:false,endedAt:serverTimestamp()});
function stopRooms(){
  receiverOn=false;rxWant=false;try{clearTimeout(recCap);rec?.stop()}catch(_){}rec=null;
  [liveRoom,listenRoom,rxRoom].forEach(r=>{try{r?.disconnect()}catch(_){}});
  liveRoom=listenRoom=rxRoom=null;
}
async function listenConnect(){
  const[LK,t]=await Promise.all([loadLK(),getToken('listen')]);
  const room=new LK.Room();
  room.on(LK.RoomEvent.TrackSubscribed,tr=>{if(tr.kind==='audio'){const el=tr.attach();el.style.display='none';document.body.append(el)}});
  room.on(LK.RoomEvent.TrackUnsubscribed,tr=>{tr.detach().forEach(e=>e.remove())});
  await room.connect(t.url,t.token);
  try{await room.startAudio()}catch(_){}
  return room;
}
function startRec(room,LK){
  try{
    const tr=room.localParticipant.getTrackPublication(LK.Track.Source.Microphone)?.track?.mediaStreamTrack;
    if(!tr||!window.MediaRecorder)return;
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    recChunks=[];recMime=mime;recT0=Date.now();recEndAt=0;
    rec=new MediaRecorder(new MediaStream([tr]),{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:32000});
    rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
    rec.start(1000);
    recCap=setTimeout(()=>{if(rec&&rec.state==='recording'){recEndAt=Date.now();rec.stop()}},15*60*1000);
  }catch(_){rec=null}
}
function stopRec(){
  return new Promise(res=>{
    clearTimeout(recCap);
    const r=rec;rec=null;
    const done=()=>{
      const blob=new Blob(recChunks,{type:recMime||'audio/webm'});
      const out=blob.size>3000?{blob,mime:blob.type,ms:(recEndAt||Date.now())-recT0}:null;
      recChunks=[];res(out);
    };
    if(!r||r.state==='inactive'){done();return}
    r.onstop=done;try{r.stop()}catch(_){done()}
  });
}
async function saveRecording(r,title){
  const buf=new Uint8Array(await r.blob.arrayBuffer());
  const SZ=700000,n=Math.ceil(buf.length/SZ);
  const ref=doc(collection(db,'announcements'));
  try{
    for(let i=0;i<n;i++)await setDoc(doc(db,'live','rec_'+ref.id+'_'+i),{i,data:Bytes.fromUint8Array(buf.slice(i*SZ,(i+1)*SZ))});
    await setDoc(ref,{title,text:'',level:'normal',type:'audio',audioParts:n,audioMime:r.mime,audioMs:r.ms,createdBy:user.uid,createdAt:serverTimestamp()});
  }catch(e){
    for(let i=0;i<n;i++)await deleteDoc(doc(db,'live','rec_'+ref.id+'_'+i)).catch(()=>{});
    throw e;
  }
}
async function removeAnn(id,n,files){
  await delFiles(files);
  for(let i=0;i<n;i++)await deleteDoc(doc(db,'live','rec_'+id+'_'+i)).catch(()=>{});
  const ms=await getDocs(collection(db,'announcements',id,'messages'));
  await Promise.all(ms.docs.map(m=>deleteDoc(m.ref)));
  await deleteDoc(doc(db,'announcements',id));
}
async function loadAudio(id,n,mime){
  const ds=await Promise.all(Array.from({length:n},(_,i)=>getDoc(doc(db,'live','rec_'+id+'_'+i))));
  if(ds.some(d=>!d.exists()))throw new Error('ไฟล์เสียงไม่ครบ');
  return new Blob(ds.map(d=>d.data().data.toUint8Array()),{type:mime||'audio/webm'});
}
const audioUrls=new Map();
function audioPlayer(id,a){
  const box=h('div',{style:'margin-top:8px',onclick:e=>e.stopPropagation()});

const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
async function shrinkImage(file){
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.78));
  }catch(_){throw new Error('อ่านภาพ '+file.name+' ไม่ได้')}
}
async function delFiles(fs){for(const f of fs||[])for(let i=0;i<f.parts;i++)await deleteDoc(doc(db,'blobs',f.id+'_'+i)).catch(()=>{})}
const MAXN=15,MAXF=15*1048576,MAXT=30*1048576;
async function putFiles(list,onProg){
  if(list.length>MAXN)throw new Error('แนบได้ไม่เกิน '+MAXN+' ไฟล์ต่อครั้ง');
  const prep=[];let total=0;
  for(const f of list){
    let blob=f,type=f.type||'application/octet-stream',name=f.name;
    if(type.startsWith('image/')){blob=await shrinkImage(f);type='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg'}
    if(blob.size>MAXF)throw new Error(name+' ใหญ่เกิน 15 MB');
    total+=blob.size;if(total>MAXT)throw new Error('ไฟล์รวมกันใหญ่เกิน 30 MB');
    prep.push({blob,type,name});
  }
  const out=[];let done=0;
  try{
    for(let k=0;k<prep.length;k++){
      const{blob,type,name}=prep[k];
      const buf=new Uint8Array(await blob.arrayBuffer());
      const id=rid(),SZ=900000,n=Math.max(1,Math.ceil(buf.length/SZ));
      out.push({id,name,type,size:blob.size,parts:n});
      for(let i=0;i<n;i+=4){
        await Promise.all(Array.from({length:Math.min(4,n-i)},(_,j)=>{
          const a=(i+j)*SZ;
          return setDoc(doc(db,'blobs',id+'_'+(i+j)),{uid:user.uid,i:i+j,data:Bytes.fromUint8Array(buf.slice(a,a+SZ))});
        }));
        done+=Math.min(4*SZ,buf.length-i*SZ);
        if(onProg)onProg('กำลังอัปโหลด ไฟล์ '+(k+1)+'/'+prep.length+' · '+Math.min(99,Math.round(done/Math.max(total,1)*100))+'%');
      }
    }
    return out;
  }catch(e){await delFiles(out);throw e}
}
const blobUrls=new Map();
async function loadFile(f){
  if(blobUrls.has(f.id))return blobUrls.get(f.id);
  const ds=await Promise.all(Array.from({length:f.parts},(_,i)=>getDoc(doc(db,'blobs',f.id+'_'+i))));
  if(ds.some(d=>!d.exists()))throw new Error('ไฟล์ไม่ครบ');
  const u=URL.createObjectURL(new Blob(ds.map(d=>d.data().data.toUint8Array()),{type:f.type}));
  blobUrls.set(f.id,u);return u;
}
function fileView(files){
  if(!files||!files.length)return null;

    const isImg=(f.type||'').startsWith('image/');
    const slot=h('div'),err=h('span',{class:'err'});

    btn.onclick=async()=>{

    };
    box.append(h('div',{},btn,err),slot);

  return box;
}

function chatBox(path,o={}){
  const counting=o.count!==false&&path[0]==='announcements';
  const list=h('div',{class:'chat-list'});
  const pill=h('button',{class:'pill',style:'display:none',onclick:()=>{list.scrollTop=list.scrollHeight;pill.style.display='none'}},'ข้อความใหม่ ↓');
  list.addEventListener('scroll',()=>{if(list.scrollHeight-list.scrollTop-list.clientHeight<40)pill.style.display='none'});
  const inp=h('input',{placeholder:'พิมพ์ข้อความ…',maxlength:'300',enterkeyhint:'send'});
  const err=h('div',{class:'err',style:'padding:0 12px'});
  const rbar=h('div',{class:'replybar',style:'display:none'});
  let last=0,first=true,replyTo=null;
  const setReply=m=>{
    replyTo=m;
    if(!m){rbar.style.display='none';return}
    rbar.replaceChildren(h('span',{},'↩ ตอบ '+m.name+': '+m.text.slice(0,40)),h('button',{class:'ghost sm',onclick:()=>setReply(null)},'ยกเลิก'));
    rbar.style.display='flex';inp.focus();
  };
  const send=async()=>{
    const v=inp.value.trim();if(!v)return;
    if(Date.now()-last<3000){err.textContent='รอสักครู่ก่อนส่งข้อความถัดไป';return}
    last=Date.now();err.textContent='';
    try{
      const b=writeBatch(db),mref=doc(collection(db,...path,'messages'));
      const m={uid:user.uid,name:profile.name,house:profile.house,role:profile.role||'resident',text:v,createdAt:serverTimestamp()};
      if(replyTo)m.replyTo=replyTo;
      b.set(mref,m);
      if(counting)b.update(doc(db,...path),{msgCount:increment(1),lastMsgAt:serverTimestamp(),lastMsgName:profile.name,lastMsgUid:user.uid});
      await b.commit();
      inp.value='';setReply(null);inp.focus();
    }catch(e){err.textContent=e.message}
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  const del=async d=>{
    const b=writeBatch(db);b.delete(d.ref);
    if(counting)b.update(doc(db,...path),{msgCount:increment(-1)});
    await b.commit().catch(e=>{err.textContent=e.message});
  };
  const jump=id=>{
    const el=list.querySelector('[data-id="'+id+'"]');if(!el)return;
    list.scrollTop=Math.max(0,el.offsetTop-list.clientHeight/2);
    el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);
  };
  const bubble=(d,replies)=>{
    const m=d.data(),me=m.uid===user.uid,adm=!!RL[m.role]||(!!o.host&&m.uid===o.host);
    const n=replies.get(d.id)||0;
    return h('div',{class:'bub'+(me?' me':'')+(adm?' adm':''),'data-id':d.id},
      me?null:h('div',{class:'who',style:'--h:'+hue(m.uid)},m.name+' · บ้าน '+m.house,RL[m.role]?h('span',{class:'badge gray'},RL[m.role]):null),
      m.replyTo?h('div',{class:'quote',onclick:()=>jump(m.replyTo.id)},'↩ '+m.replyTo.name+' (บ้าน '+m.replyTo.house+'): '+m.replyTo.text):null,
      h('div',{class:'txt'},m.text),
      h('div',{class:'t'},n?h('span',{class:'rcount'},'💬 '+n+' ตอบ'):null,hhmm(m.createdAt),
        h('button',{class:'x',onclick:()=>setReply({id:d.id,name:m.name,house:m.house,text:m.text.slice(0,80)})},'↩ ตอบ'),
        isAdmin()?h('button',{class:'x',onclick:()=>del(d)},'ลบ'):null));
  };
  const off=onSnapshot(query(collection(db,...path,'messages'),orderBy('createdAt','asc'),limit(500)),snap=>{
    const prev=list.scrollTop;
    const near=list.scrollHeight-list.scrollTop-list.clientHeight<80;
    const mine=snap.docs.length>0&&snap.docs[snap.docs.length-1].data().uid===user.uid;
    const replies=new Map();
    snap.docs.forEach(d=>{const r=d.data().replyTo;if(r)replies.set(r.id,(replies.get(r.id)||0)+1)});
    list.replaceChildren(...(snap.empty?[h('div',{class:'nomsg'},'ยังไม่มีข้อความ พิมพ์ได้เลย')]:snap.docs.map(d=>bubble(d,replies))));
    if(first||near||mine){list.scrollTop=list.scrollHeight;pill.style.display='none'}
    else{list.scrollTop=prev;pill.style.display=''}
    first=false;
  },e=>{list.replaceChildren(h('div',{class:'nomsg'},e.message))});
  return{off,el:h('div',{class:'chat'+(o.fixed?' fixed':'')},list,pill,h('div',{class:'chat-foot'},rbar,h('div',{class:'chat-in'},inp,h('button',{onclick:send},'ส่ง')),err))};
}
function chatSync(hold,cs,d){
  const id=liveOn(d)&&d.announcementId;
  if(!id){if(cs.off){cs.off();cs.off=null;cs.id=null}hold.replaceChildren();return}
  if(cs.id===id)return;
  if(cs.off)cs.off();
  const cb=chatBox(['announcements',id],{host:d.startedBy,count:false});
  cs.id=id;cs.off=cb.off;
  hold.replaceChildren(h('h3',{style:'margin:14px 0 8px'},'แชทสด'),cb.el);
}

    rxBusy=true;st.textContent='กำลังเชื่อมต่อเสียงประกาศ…';
    try{

      if(!receiverOn||!rxWant){r.disconnect();return}

        if(rxRoom===r){rxRoom=null;if(receiverOn&&rxWant){st.textContent='ขาดการเชื่อมต่อ กำลังลองใหม่…';setTimeout(()=>rxSync(st),2000)}}

    finally{rxBusy=false}
  }else if(!rxWant&&rxRoom){
    const r=rxRoom;rxRoom=null;try{await r.disconnect()}catch(_){}
    st.textContent='พร้อมรับเสียง — รอประกาศสด';
  }
}

function showMain(tab='news'){
  const subs=unsubs.slice(0,1);unsubs.forEach((u,i)=>{if(i>0)u()});unsubs=subs;
  const body=h('div');
  const nb=h('span',{class:'badge',style:'display:none'}),cb=h('span',{class:'badge',style:'display:none'});
  const tb=(k,label,bd)=>h('button',{class:tab===k?'':'ghost',onclick:()=>showMain(k)},label,bd);
  show(h('div',{class:'bar hero'},h('div',{},h('h1',{},'🏡 ประกาศหมู่บ้าน'),h('div',{class:'who'},profile.name+' · บ้าน '+profile.house+(RL[profile.role]?' · '+RL[profile.role]:''))),logoutBtn()),
    h('div',{class:'tabs'},tb('news','ประกาศ',nb),tb('cmp','แจ้งปัญหา',cb),isMgr()?tb('members','สมาชิก'):null),body);
  const setB=(el,n)=>{el.textContent=n>99?'99+':String(n);el.style.display=n?'':'none'};
  let anns=[],cmps=[],paintTab=()=>{};
  const paintBadges=()=>{
    const un=anns.reduce((t,d)=>t+unreadOf(d),0);
    const cn=isAdmin()?cmps.filter(d=>d.data().status==='new').length:cmps.filter(d=>{const c=d.data();return c.status!=='new'&&csGet(d.id)!==c.status}).length;
    setB(nb,un);setB(cb,cn);
    document.title=(un+cn?'('+(un+cn)+') ':'')+'ประกาศหมู่บ้าน';
  };
  unsubs.push(onSnapshot(query(collection(db,'announcements'),orderBy('createdAt','desc'),limit(30)),snap=>{
    if(isAdmin()&&!liveRoom)snap.docs.forEach(d=>{const a=d.data();
      if(a.type==='live'&&d.id!==liveAnnId&&d.id!==curLiveId&&a.createdAt?.toDate&&Date.now()-a.createdAt.toDate().getTime()>120000)cleanupLive(d.id)});
    anns=snap.docs.filter(d=>d.data().type!=='live');
    paintBadges();if(tab==='news')paintTab();
  },showError));
  unsubs.push(onSnapshot(isAdmin()?query(collection(db,'complaints'),orderBy('createdAt','desc'),limit(100)):query(collection(db,'complaints'),where('uid','==',user.uid)),snap=>{
    cmps=snap.docs;paintBadges();if(tab==='cmp')paintTab();
  },()=>{}));

  if(tab==='members'&&isMgr())return renderMembers(body);
  if(tab==='news'){
    const list=h('div');
    body.append(isAdmin()?liveAdminCard():liveListenCard());
    if(isAdmin())body.append(composer());
    body.append(list);
    paintTab=()=>renderNews(list,anns);
    return;
  }
  body.append(h('p',{class:'meta'},'กำลังโหลด…'));
  loadCats().then(()=>{
    const listC=h('div'),fbar=h('div',{class:'row',style:'flex-wrap:wrap;margin-bottom:12px'});let flt='all';
    body.replaceChildren(...(isAdmin()?[...(isMgr()?[catEditor()]:[]),fbar]:[cmpForm(),h('h3',{style:'margin:14px 0 8px'},'เรื่องของฉัน')]),listC);
    paintTab=()=>{
      let arr=cmps.slice();
      if(isAdmin()){
        const cnt=k=>cmps.filter(d=>d.data().status===k).length;
        fbar.replaceChildren(...[['all','ทั้งหมด ('+cmps.length+')'],['new','รอรับ ('+cnt('new')+')'],['accepted','ดำเนินการ ('+cnt('accepted')+')'],['done','เสร็จ ('+cnt('done')+')']]
          .map(([k,l])=>h('button',{class:'sm '+(flt===k?'':'ghost'),onclick:()=>{flt=k;paintTab()}},l)));
        if(flt!=='all')arr=arr.filter(d=>d.data().status===flt);
      }else arr.sort((a,b)=>(b.data().createdAt?.toMillis?.()||1e15)-(a.data().createdAt?.toMillis?.()||1e15));
      listC.replaceChildren(...(arr.length?arr.map(d=>complaintCard(d)):[h('p',{class:'center meta'},isAdmin()?'ไม่มีเรื่อง':'ยังไม่มีเรื่องที่แจ้ง')]));
      if(!isAdmin()){cmps.forEach(d=>csSet(d.id,d.data().status));paintBadges()}
    };
    paintTab();
  });
}

    h('label',{},'เบอร์โทร (ข้อมูลติดต่อ)'),phone,
    h('label',{},'สิทธิ์'+(isOwner()?'':' (เปลี่ยนได้เฉพาะแอดมิน)')),role,
    h('p',{class:'meta'},'การแก้เบอร์ตรงนี้ไม่เปลี่ยนชื่อผู้ใช้ที่ใช้ล็อกอิน (ยังเป็นเบอร์ตอนสมัคร)'),
    h('div',{class:'row'},h('button',{class:'sm',onclick:save},'บันทึก'),h('button',{class:'ghost sm',onclick:()=>{form.style.display='none'}},'ยกเลิก')),msg);
  const btns=[];
  if(!locked){
    btns.push(h('button',{class:'ghost sm',onclick:()=>{form.style.display=form.style.display==='none'?'':'none'}},'✏️ แก้ไข'));
    if(!self){
      btns.push(h('button',{class:'ghost sm',onclick:()=>{if(confirm('ระงับ '+(u.name||'')+' ? จะเข้าใช้งานไม่ได้จนกว่าจะอนุมัติใหม่'))updateDoc(ref,{approved:false}).catch(e=>alert(e.message))}},'⏸ ระงับ'));
      btns.push(h('button',{class:'ghost sm',onclick:()=>{if(confirm('ลบข้อมูลสมาชิก '+(u.name||'')+' ?\n(บัญชีล็อกอินยังอยู่ใน Firebase ถ้าเขาล็อกอินอีกจะต้องกรอกข้อมูลและรหัสหมู่บ้านใหม่)'))deleteDoc(ref).catch(e=>alert(e.message))}},'🗑 ลบ'));
    }
  }
  return h('div',{class:'card'},
    h('h3',{},u.name||'(ไม่มีชื่อ)',RL[u.role]?h('span',{class:'badge gray',style:'margin-left:8px'},RL[u.role]):null,self?h('span',{class:'badge gray',style:'margin-left:6px'},'คุณ'):null),
    h('div',{class:'meta'},'บ้าน '+(u.house||'-')+' · โทร '+(u.phone||'-')+(u.email?' · '+u.email:'')),
    h('div',{class:'meta'},'สมัครเมื่อ '+when(u.createdAt)),
    btns.length?h('div',{class:'row',style:'margin-top:10px;flex-wrap:wrap'},...btns):null,form);
}

function renderMembers(body){
  const pend=h('div'),mem=h('div'),q=h('input',{placeholder:'ค้นหาชื่อ / บ้านเลขที่ / เบอร์'});
  body.append(settingsCard(),
    h('h3',{style:'margin:14px 0 8px'},'รออนุมัติ / ถูกระงับ'),pend,
    h('h3',{style:'margin:14px 0 8px'},'สมาชิกทั้งหมด'),q,mem);
  let all=[];
  const paintMem=()=>{
    const k=q.value.trim().toLowerCase();
    const arr=all.filter(d=>{const u=d.data();return !k||[u.name,u.house,u.phone].join(' ').toLowerCase().includes(k)})
      .sort((a,b)=>String(a.data().house||'').localeCompare(String(b.data().house||''),'th',{numeric:true}));
    mem.replaceChildren(h('p',{class:'meta'},'ทั้งหมด '+all.length+' คน'+(k?' · พบ '+arr.length:'')),...(arr.length?arr.map(memberCard):[h('p',{class:'center meta'},'ไม่พบสมาชิก')]));
  };
  q.addEventListener('input',paintMem);
  unsubs.push(onSnapshot(query(collection(db,'users'),where('approved','==',false)),snap=>{
    if(snap.empty){pend.replaceChildren(h('p',{class:'center meta'},'ไม่มีรายการ'));return}
    pend.replaceChildren(...snap.docs.map(d=>{const u=d.data();
      return h('div',{class:'card'},h('h3',{},u.name||''),h('div',{class:'meta'},'บ้าน '+(u.house||'-')+' · '+(u.phone||'ไม่ระบุเบอร์')+' · '+(u.email||'')),
        h('div',{class:'row',style:'margin-top:10px'},
          h('button',{class:'sm',onclick:()=>updateDoc(doc(db,'users',d.id),{approved:true}).catch(e=>alert(e.message))},'อนุมัติ / เปิดใช้'),
          h('button',{class:'sm danger',onclick:()=>{if(confirm('ลบ '+(u.name||'')+' ?'))deleteDoc(doc(db,'users',d.id)).catch(e=>alert(e.message))}},'ลบ')))}));
  },showError));
  unsubs.push(onSnapshot(query(collection(db,'users'),where('approved','==',true)),snap=>{all=snap.docs;paintMem()},showError));
}

function showThread(id,a){
  const subs=unsubs.slice(0,1);unsubs.forEach((u,i)=>{if(i>0)u()});unsubs=subs;
  const cb=chatBox(['announcements',id],{fixed:true});unsubs.push(cb.off);
  unsubs.push(onSnapshot(doc(db,'announcements',id),x=>{if(x.exists())seenSet(id,x.data().msgCount||0)},()=>{}));
  show(h('div',{class:'bar'},h('button',{class:'ghost sm',onclick:()=>showMain()},'‹ กลับ'),logoutBtn()),
    h('div',{class:'card item '+a.level},h('span',{class:'tag '+a.level},LV[a.level]||'ทั่วไป'),h('h3',{},a.title),h('div',{},a.text),
      fileView(a.files),a.type==='audio'?audioPlayer(id,a):null,h('div',{class:'meta'},when(a.createdAt))),
    h('h3',{style:'margin:14px 0 8px'},'ถาม-ตอบ'),cb.el);
  root.classList.add('hasfix');
}
</script>
