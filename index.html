<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ประกาศหมู่บ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f5;--card:#fff;--ink:#14202b;--mut:#5d6b78;--pri:#0f4c75;--on:#fff;--line:#d3dde6;--amber:#b86e00;--red:#c62828;--ok:#1b7a4a}
@media(prefers-color-scheme:dark){:root{--bg:#0e151b;--card:#17212a;--ink:#eaf1f6;--mut:#93a3b1;--pri:#6cb6e8;--on:#08202f;--line:#27343f;--amber:#f0a73a;--red:#ff7a70;--ok:#5ad08f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Sarabun,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,button,.tag{font-family:Kanit,sans-serif;margin:0}
main{max-width:640px;margin:0 auto;padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.bar h1{font-size:24px}
.who{color:var(--mut);font-size:15px}
button{font-size:17px;border:0;border-radius:10px;padding:12px 18px;background:var(--pri);color:var(--on);cursor:pointer;min-height:48px}
button.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}
button.sm{min-height:40px;padding:6px 14px;font-size:15px}
button.danger{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 12px}
label{font-weight:600;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.item{cursor:pointer;border-left:6px solid var(--pri)}
.item.urgent{border-left-color:var(--amber)}
.item.emergency{border-left-color:var(--red)}
.item h3{font-size:20px}
.tag{display:inline-block;font-size:14px;padding:1px 10px;border-radius:99px;background:var(--line);margin-right:6px}
.tag.urgent{background:var(--amber);color:#fff}.tag.emergency{background:var(--red);color:#fff}
.meta{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.msg{padding:8px 0;border-bottom:1px solid var(--line)}
.msg b{font-family:Kanit,sans-serif;font-weight:500}
.row{display:flex;gap:8px}.row input{margin:0}
.center{text-align:center;padding:48px 8px}
.err{color:var(--red);min-height:1.5em}
.live{opacity:.7;border:1.5px dashed var(--line);background:transparent}
</style>
</head>
<body>
<main id="app"><p class="center">กำลังโหลด…</p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDRAIAlliLTUAxYTgn0iIiyrCM_0D3Zxjo",
  authDomain:"village-announce.firebaseapp.com",
  projectId:"village-announce",
  storageBucket:"village-announce.firebasestorage.app",
  messagingSenderId:"415192312495",
  appId:"1:415192312495:web:aa84767a4e48727529425a"
});
const auth=getAuth(app),db=getFirestore(app);
const root=document.getElementById('app');
const LV={normal:'ทั่วไป',urgent:'ด่วน',emergency:'ฉุกเฉิน'};
let user=null,profile=null,unsubs=[];

const h=(t,a={},...k)=>{const e=document.createElement(t);
  for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}
  k.flat().forEach(c=>{if(c!=null)e.append(c)});return e};
const show=(...n)=>{root.replaceChildren(...n)};
const clean=()=>{unsubs.forEach(u=>u());unsubs=[]};
const when=t=>{const d=t?.toDate?.();return d?d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'กำลังส่ง…'};
const isAdmin=()=>profile?.role==='admin';
const logoutBtn=()=>h('button',{class:'ghost sm',onclick:()=>signOut(auth)},'ออกจากระบบ');

onAuthStateChanged(auth,async u=>{
  clean();user=u;profile=null;
  if(!u)return showLogin();
  try{
    const s=await getDoc(doc(db,'users',u.uid));
    if(!s.exists())return showRegister();
    watchProfile();
  }catch(e){showError(e)}
});

function showError(e){
  show(h('div',{class:'card center'},h('h2',{},'เกิดข้อผิดพลาด'),h('p',{},e.message||String(e)),logoutBtn()));
}

function showLogin(){
  const err=h('p',{class:'err'});
  show(h('div',{class:'center'},
    h('h1',{},'ประกาศหมู่บ้าน'),
    h('p',{class:'meta'},'รับข่าวสารจากผู้ใหญ่บ้านและคณะกรรมการ'),
    h('button',{onclick:async()=>{
      try{await signInWithPopup(auth,new GoogleAuthProvider())}
      catch(e){err.textContent='เข้าสู่ระบบไม่สำเร็จ: '+(e.code||e.message)}
    }},'เข้าสู่ระบบด้วย Google'),err));
}

function showRegister(){
  const name=h('input',{value:user.displayName||'',autocomplete:'name'});
  const house=h('input',{placeholder:'เช่น 12/3'});
  const phone=h('input',{type:'tel',autocomplete:'tel'});
  const err=h('p',{class:'err'});
  show(h('div',{class:'bar'},h('h1',{},'สมัครเป็นลูกบ้าน'),logoutBtn()),
    h('div',{class:'card'},
      h('label',{},'ชื่อ-นามสกุล'),name,
      h('label',{},'บ้านเลขที่'),house,
      h('label',{},'เบอร์โทร'),phone,
      h('button',{onclick:async()=>{
        if(!name.value.trim()||!house.value.trim()){err.textContent='กรุณากรอกชื่อและบ้านเลขที่';return}
        try{
          await setDoc(doc(db,'users',user.uid),{name:name.value.trim(),house:house.value.trim(),phone:phone.value.trim(),email:user.email||'',role:'resident',approved:false,createdAt:serverTimestamp()});
          watchProfile();
        }catch(e){err.textContent=e.message}
      }},'ส่งคำขอสมัคร'),err));
}

function watchProfile(){
  clean();
  unsubs.push(onSnapshot(doc(db,'users',user.uid),s=>{
    if(!s.exists())return showRegister();
    profile=s.data();
    if(!profile.approved)return showPending();
    if(!root.dataset.main){root.dataset.main='1';showMain()}
  },showError));
}

function showPending(){
  delete root.dataset.main;
  show(h('div',{class:'card center'},h('h2',{},'รอผู้ดูแลอนุมัติ'),
    h('p',{},'ส่งคำขอแล้ว เมื่อผู้ดูแลอนุมัติ หน้านี้จะเปลี่ยนให้อัตโนมัติ'),logoutBtn()));
}

function showMain(tab='news'){
  const subs=unsubs.slice(0,1);unsubs.forEach((u,i)=>{if(i>0)u()});unsubs=subs;
  const list=h('div'),body=h('div');
  const tabs=h('div',{class:'tabs'},
    h('button',{class:tab==='news'?'':'ghost',onclick:()=>showMain('news')},'ประกาศ'),
    isAdmin()?h('button',{class:tab==='members'?'':'ghost',onclick:()=>showMain('members')},'สมาชิก'):null);
  show(h('div',{class:'bar'},h('div',{},h('h1',{},'ประกาศหมู่บ้าน'),h('div',{class:'who'},profile.name+' · บ้าน '+profile.house)),logoutBtn()),
    tabs,body);
  if(tab==='members')return renderMembers(body);
  body.append(h('div',{class:'card live'},h('b',{},'ประกาศสด'),h('div',{class:'meta'},'ยังไม่เปิดใช้งาน จะเพิ่มในขั้นต่อไป')));
  if(isAdmin())body.append(composer());
  body.append(list);
  unsubs.push(onSnapshot(query(collection(db,'announcements'),orderBy('createdAt','desc'),limit(30)),snap=>{
    if(snap.empty){list.replaceChildren(h('p',{class:'center meta'},'ยังไม่มีประกาศ'));return}
    list.replaceChildren(...snap.docs.map(d=>{const a=d.data();
      return h('div',{class:'card item '+a.level,onclick:()=>showThread(d.id,a)},
        h('span',{class:'tag '+a.level},LV[a.level]||'ทั่วไป'),h('h3',{},a.title),
        h('div',{},a.text),h('div',{class:'meta'},when(a.createdAt)+' · แตะเพื่อถามหรือตอบ'))}));
  },showError));
}

function composer(){
  const t=h('input',{placeholder:'หัวข้อ'});
  const x=h('textarea',{rows:3,placeholder:'รายละเอียด'});
  const l=h('select',{},...Object.entries(LV).map(([k,v])=>h('option',{value:k},v)));
  const err=h('p',{class:'err'});
  return h('div',{class:'card'},h('h3',{},'สร้างประกาศ'),t,x,l,
    h('button',{onclick:async()=>{
      if(!t.value.trim()){err.textContent='กรุณากรอกหัวข้อ';return}
      try{await addDoc(collection(db,'announcements'),{title:t.value.trim(),text:x.value.trim(),level:l.value,type:'text',createdBy:user.uid,createdAt:serverTimestamp()});
        t.value='';x.value='';err.textContent=''}catch(e){err.textContent=e.message}
    }},'ประกาศ'),err);
}

function renderMembers(body){
  unsubs.push(onSnapshot(query(collection(db,'users'),where('approved','==',false)),snap=>{
    if(snap.empty){body.replaceChildren(h('p',{class:'center meta'},'ไม่มีคำขอที่รออนุมัติ'));return}
    body.replaceChildren(...snap.docs.map(d=>{const u=d.data();
      return h('div',{class:'card'},h('h3',{},u.name),h('div',{class:'meta'},'บ้าน '+u.house+' · '+(u.phone||'ไม่ระบุเบอร์')+' · '+(u.email||'')),
        h('div',{class:'row',style:'margin-top:10px'},
          h('button',{class:'sm',onclick:()=>updateDoc(doc(db,'users',d.id),{approved:true})},'อนุมัติ'),
          h('button',{class:'sm danger',onclick:()=>{if(confirm('ลบคำขอของ '+u.name+' ?'))deleteDoc(doc(db,'users',d.id))}},'ลบ')))}));
  },showError));
}

function showThread(id,a){
  const subs=unsubs.slice(0,1);unsubs.forEach((u,i)=>{if(i>0)u()});unsubs=subs;
  const msgs=h('div'),inp=h('input',{placeholder:'พิมพ์คำถาม…',maxlength:'300'});
  const err=h('p',{class:'err'});let last=0;
  const send=async()=>{
    const v=inp.value.trim();if(!v)return;
    if(Date.now()-last<5000){err.textContent='รอสักครู่ก่อนส่งข้อความถัดไป';return}
    last=Date.now();err.textContent='';
    try{await addDoc(collection(db,'announcements',id,'messages'),{uid:user.uid,name:profile.name,house:profile.house,text:v,createdAt:serverTimestamp()});inp.value=''}
    catch(e){err.textContent=e.message}
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  show(h('div',{class:'bar'},h('button',{class:'ghost sm',onclick:()=>showMain()},'‹ กลับ'),logoutBtn()),
    h('div',{class:'card item '+a.level},h('span',{class:'tag '+a.level},LV[a.level]||'ทั่วไป'),h('h3',{},a.title),h('div',{},a.text),h('div',{class:'meta'},when(a.createdAt))),
    h('div',{class:'card'},h('h3',{},'ถาม-ตอบ'),msgs,h('div',{class:'row',style:'margin-top:12px'},inp,h('button',{onclick:send},'ส่ง')),err));
  unsubs.push(onSnapshot(query(collection(db,'announcements',id,'messages'),orderBy('createdAt','asc'),limit(200)),snap=>{
    if(snap.empty){msgs.replaceChildren(h('p',{class:'meta'},'ยังไม่มีคำถาม'));return}
    msgs.replaceChildren(...snap.docs.map(d=>{const m=d.data();
      return h('div',{class:'msg'},h('b',{},m.name+' (บ้าน '+m.house+')'),' ',h('span',{class:'meta'},when(m.createdAt)),h('div',{},m.text),
        isAdmin()?h('button',{class:'ghost sm',onclick:()=>deleteDoc(doc(db,'announcements',id,'messages',d.id))},'ลบ'):null)}));
  },showError));
}
</script>
</body>
</html>
