<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ประกาศหมู่บ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f5;--card:#fff;--ink:#14202b;--mut:#5d6b78;--pri:#0f4c75;--on:#fff;--line:#d3dde6;--amber:#b86e00;--red:#c62828;--ok:#1b7a4a}
@media(prefers-color-scheme:dark){:root{--bg:#0e151b;--card:#17212a;--ink:#eaf1f6;--mut:#93a3b1;--pri:#6cb6e8;--on:#08202f;--line:#27343f;--amber:#f0a73a;--red:#ff7a70;--ok:#5ad08f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Sarabun,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3,button,.tag{font-family:Kanit,sans-serif;margin:0}
main{max-width:640px;margin:0 auto;padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.bar h1{font-size:24px}
.who{color:var(--mut);font-size:15px}
button{font-size:17px;border:0;border-radius:10px;padding:12px 18px;background:var(--pri);color:var(--on);cursor:pointer;min-height:48px}
button.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}
button.sm{min-height:40px;padding:6px 14px;font-size:15px}
button.danger{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:4px 0 12px}
label{font-weight:600;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.item{cursor:pointer;border-left:6px solid var(--pri)}
.item.urgent{border-left-color:var(--amber)}
.item.emergency{border-left-color:var(--red)}
.item h3{font-size:20px}
.tag{display:inline-block;font-size:14px;padding:1px 10px;border-radius:99px;background:var(--line);margin-right:6px}
.tag.urgent{background:var(--amber);color:#fff}.tag.emergency{background:var(--red);color:#fff}
.meta{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.msg{padding:8px 0;border-bottom:1px solid var(--line)}
.msg b{font-family:Kanit,sans-serif;font-weight:500}
.row{display:flex;gap:8px}.row input{margin:0}
.center{text-align:center;padding:48px 8px}
.err{color:var(--red);min-height:1.5em}
.live{opacity:.7;border:1.5px dashed var(--line);background:transparent}
.chat{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.chat-list{height:min(50vh,420px);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.bub{max-width:84%;padding:8px 13px;border-radius:16px 16px 16px 4px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--pri);color:var(--on);border-color:transparent;border-radius:16px 16px 4px 16px}
.bub.adm{border-left:5px solid var(--amber)}
.bub .who{font:500 13px Kanit,sans-serif;color:var(--mut)}
.bub.me .who{color:inherit}
.bub .txt{font-size:18px;line-height:1.45}
.bub .t{font-size:12px;opacity:.7;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.bub .x{background:none;border:0;color:inherit;text-decoration:underline;font-size:12px;min-height:0;padding:0;opacity:.8}
.chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--card)}
.chat-in input{margin:0}
.nomsg{color:var(--mut);text-align:center;margin:auto}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;min-height:36px;padding:4px 14px;font-size:14px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
</style>
</head>
<body>
<main id="app"><p class="center">กำลังโหลด…</p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,Bytes}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDRAIAlliLTUAxYTgn0iIiyrCM_0D3Zxjo",
  authDomain:"village-announce.firebaseapp.com",
  projectId:"village-announce",
  storageBucket:"village-announce.firebasestorage.app",
  messagingSenderId:"415192312495",
  appId:"1:415192312495:web:aa84767a4e48727529425a"
});
const auth=getAuth(app),db=getFirestore(app);
const root=document.getElementById('app');
const LV={normal:'ทั่วไป',urgent:'ด่วน',emergency:'ฉุกเฉิน'};
let user=null,profile=null,unsubs=[],signingUp=false;

const h=(t,a={},...k)=>{const e=document.createElement(t);
  for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}
  k.flat().forEach(c=>{if(c!=null)e.append(c)});return e};
const show=(...n)=>{root.replaceChildren(...n)};
const clean=()=>{unsubs.forEach(u=>u());unsubs=[]};
const when=t=>{const d=t?.toDate?.();return d?d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'กำลังส่ง…'};
const isAdmin=()=>profile?.role==='admin';
const logoutBtn=()=>h('button',{class:'ghost sm',onclick:()=>signOut(auth)},'ออกจากระบบ');

onAuthStateChanged(auth,async u=>{
  clean();stopRooms();user=u;profile=null;
  if(signingUp)return;
  if(!u)return showLogin();
  try{
    const s=await getDoc(doc(db,'users',u.uid));
    if(!s.exists())return showRegister();
    watchProfile();
  }catch(e){showError(e)}
});

function showError(e){
  show(h('div',{class:'card center'},h('h2',{},'เกิดข้อผิดพลาด'),h('p',{},e.message||String(e)),logoutBtn()));
}

const pwField=(ac,ph,max)=>{
  const input=h('input',{type:'password',autocomplete:ac,...(ph?{placeholder:ph}:{}),...(max?{maxlength:String(max)}:{})});
  const btn=h('button',{type:'button','aria-pressed':'false',class:'ghost sm',style:'white-space:nowrap',onclick:()=>{
    const show=input.type==='password';input.type=show?'text':'password';
    btn.textContent=show?'ซ่อน':'ดู';btn.setAttribute('aria-pressed',String(show))}},'ดู');
  return{input,row:h('div',{class:'row',style:'margin:4px 0 12px'},input,btn)};
};
const toEmail=p=>p.replace(/\D/g,'')+'@village-announce.app';
const okPhone=p=>/^0\d{8,9}$/.test(p.replace(/\D/g,''));
const authMsg=e=>({'auth/invalid-credential':'เบอร์หรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบเบอร์นี้ในระบบ','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/email-already-in-use':'เบอร์นี้สมัครแล้ว กรุณาเข้าสู่ระบบ','auth/weak-password':'รหัสผ่านต้องมี 6 ตัวพอดี','auth/too-many-requests':'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่','auth/operation-not-allowed':'ยังไม่ได้เปิดการสมัครด้วยอีเมล/รหัสผ่านใน Firebase','auth/popup-closed-by-user':'ปิดหน้าต่างก่อนเข้าสู่ระบบสำเร็จ'}[e.code]||('เกิดข้อผิดพลาด: '+(e.code||e.message)));

function showLogin(){
  const phone=h('input',{type:'tel',inputmode:'numeric',autocomplete:'username',placeholder:'0812345678'});
  const pwf=pwField('current-password'),pw=pwf.input;
  const err=h('p',{class:'err'});
  const go=async()=>{
    if(!okPhone(phone.value)){err.textContent='เบอร์โทรต้องขึ้นต้นด้วย 0 และมี 9–10 หลัก';return}
    try{await signInWithEmailAndPassword(auth,toEmail(phone.value),pw.value)}catch(e){err.textContent=authMsg(e)}
  };
  pw.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  show(h('div',{style:'padding:24px 0'},h('h1',{},'ประกาศหมู่บ้าน'),h('p',{class:'meta'},'รับข่าวสารจากผู้ใหญ่บ้านและคณะกรรมการ')),
    h('div',{class:'card'},
      h('label',{},'เบอร์โทร'),phone,h('label',{},'รหัสผ่าน'),pwf.row,
      h('button',{onclick:go},'เข้าสู่ระบบ'),err,
      h('p',{class:'meta'},'ยังไม่มีบัญชี?'),
      h('div',{class:'row'},
        h('button',{class:'ghost',onclick:showSignup},'สมัครใหม่'),
        h('button',{class:'ghost',onclick:async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){err.textContent=authMsg(e)}}},'ใช้ Google'))));
}

const TOKEN_URL='https://village-token.ballmechai.workers.dev';
const LK_SRC='https://cdn.jsdelivr.net/npm/livekit-client@2.5.0/dist/livekit-client.umd.min.js';
let rec=null,recChunks=[],recT0=0,recEndAt=0,recMime='',recCap=null,pendingRec=null,liveAnnId=null,curLiveId=null,liveRoom=null,listenRoom=null,rxRoom=null,receiverOn=false,rxWant=false,rxBusy=false,wl=null;

const loadLK=()=>window.LivekitClient?Promise.resolve(window.LivekitClient):new Promise((ok,no)=>{
  const t=document.createElement('script');t.src=LK_SRC;
  t.onload=()=>ok(window.LivekitClient);t.onerror=()=>no(new Error('โหลดตัวเชื่อมเสียงไม่สำเร็จ ตรวจอินเทอร์เน็ต'));
  document.head.append(t);
});
async function getToken(mode){
  const idt=await user.getIdToken();
  const r=await fetch(TOKEN_URL,{method:'POST',headers:{Authorization:'Bearer '+idt,'Content-Type':'application/json'},body:JSON.stringify({mode})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error==='admin only'?'ใช้ได้เฉพาะแอดมิน':j.error==='not approved'?'ยังไม่ได้รับอนุมัติ':'ขอสิทธิ์เสียงไม่สำเร็จ ('+(j.error||r.status)+')');
  return j;
}
const liveOn=d=>!!d&&d.active===true&&(!d.startedAt?.toDate||Date.now()-d.startedAt.toDate().getTime()<3*3600*1000);
const offLive=()=>setDoc(doc(db,'live','current'),{active:false,endedAt:serverTimestamp()});
function stopRooms(){
  receiverOn=false;rxWant=false;try{clearTimeout(recCap);rec?.stop()}catch(_){}rec=null;
  [liveRoom,listenRoom,rxRoom].forEach(r=>{try{r?.disconnect()}catch(_){}});
  liveRoom=listenRoom=rxRoom=null;
}
async function listenConnect(){
  const[LK,t]=await Promise.all([loadLK(),getToken('listen')]);
  const room=new LK.Room();
  room.on(LK.RoomEvent.TrackSubscribed,tr=>{if(tr.kind==='audio'){const el=tr.attach();el.style.display='none';document.body.append(el)}});
  room.on(LK.RoomEvent.TrackUnsubscribed,tr=>{tr.detach().forEach(e=>e.remove())});
  await room.connect(t.url,t.token);
  try{await room.startAudio()}catch(_){}
  return room;
}
function startRec(room,LK){
  try{
    const tr=room.localParticipant.getTrackPublication(LK.Track.Source.Microphone)?.track?.mediaStreamTrack;
    if(!tr||!window.MediaRecorder)return;
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    recChunks=[];recMime=mime;recT0=Date.now();recEndAt=0;
    rec=new MediaRecorder(new MediaStream([tr]),{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:32000});
    rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
    rec.start(1000);
    recCap=setTimeout(()=>{if(rec&&rec.state==='recording'){recEndAt=Date.now();rec.stop()}},15*60*1000);
  }catch(_){rec=null}
}
function stopRec(){
  return new Promise(res=>{
    clearTimeout(recCap);
    const r=rec;rec=null;
    const done=()=>{
      const blob=new Blob(recChunks,{type:recMime||'audio/webm'});
      const out=blob.size>3000?{blob,mime:blob.type,ms:(recEndAt||Date.now())-recT0}:null;
      recChunks=[];res(out);
    };
    if(!r||r.state==='inactive'){done();return}
    r.onstop=done;try{r.stop()}catch(_){done()}
  });
}
async function saveRecording(r,title){
  const buf=new Uint8Array(await r.blob.arrayBuffer());
  const SZ=700000,n=Math.ceil(buf.length/SZ);
  const ref=doc(collection(db,'announcements'));
  try{
    for(let i=0;i<n;i++)await setDoc(doc(db,'live','rec_'+ref.id+'_'+i),{i,data:Bytes.fromUint8Array(buf.slice(i*SZ,(i+1)*SZ))});
    await setDoc(ref,{title,text:'',level:'normal',type:'audio',audioParts:n,audioMime:r.mime,audioMs:r.ms,createdBy:user.uid,createdAt:serverTimestamp()});
  }catch(e){
    for(let i=0;i<n;i++)await deleteDoc(doc(db,'live','rec_'+ref.id+'_'+i)).catch(()=>{});
    throw e;
  }
}
async function removeAnn(id,n){
  for(let i=0;i<n;i++)await deleteDoc(doc(db,'live','rec_'+id+'_'+i)).catch(()=>{});
  const ms=await getDocs(collection(db,'announcements',id,'messages'));
  await Promise.all(ms.docs.map(m=>deleteDoc(m.ref)));
  await deleteDoc(doc(db,'announcements',id));
}
async function loadAudio(id,n,mime){
  const ds=await Promise.all(Array.from({length:n},(_,i)=>getDoc(doc(db,'live','rec_'+id+'_'+i))));
  if(ds.some(d=>!d.exists()))throw new Error('ไฟล์เสียงไม่ครบ');
  return new Blob(ds.map(d=>d.data().data.toUint8Array()),{type:mime||'audio/webm'});
}
const audioUrls=new Map();
function audioPlayer(id,a){
  const box=h('div',{style:'margin-top:8px',onclick:e=>e.stopPropagation()});
  const secs=Math.round((a.audioMs||0)/1000);
  const label='▶ ฟังเสียงที่บันทึก'+(secs?' ('+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')+')':'');
  const btn=h('button',{},label),err=h('p',{class:'err'});
  const play=url=>box.replaceChildren(h('audio',{controls:'',autoplay:'',src:url,style:'width:100%'}));
  btn.onclick=async()=>{
    if(audioUrls.has(id))return play(audioUrls.get(id));
    btn.disabled=true;btn.textContent='กำลังโหลดเสียง…';err.textContent='';
    try{const b=await loadAudio(id,a.audioParts,a.audioMime);const u=URL.createObjectURL(b);audioUrls.set(id,u);play(u)}
    catch(e){err.textContent=e.message;btn.disabled=false;btn.textContent=label}
  };
  box.append(btn,err);return box;
}

const cleaned=new Set();
async function cleanupLive(id){
  if(!id||cleaned.has(id))return;cleaned.add(id);
  try{
    const ms=await getDocs(collection(db,'announcements',id,'messages'));
    await Promise.all(ms.docs.map(m=>deleteDoc(m.ref)));
    await deleteDoc(doc(db,'announcements',id));
  }catch(_){cleaned.delete(id)}
}
async function stopLive(){
  const r=liveRoom,id=liveAnnId;liveRoom=null;liveAnnId=null;
  try{await offLive()}catch(_){}
  try{await r?.disconnect()}catch(_){}
  cleanupLive(id);
}

const hhmm=t=>{const d=t?.toDate?.();return d?d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'…'};
function chatBox(id,o={}){
  const list=h('div',{class:'chat-list'});
  const pill=h('button',{class:'pill',style:'display:none',onclick:()=>{list.scrollTop=list.scrollHeight;pill.style.display='none'}},'ข้อความใหม่ ↓');
  list.addEventListener('scroll',()=>{if(list.scrollHeight-list.scrollTop-list.clientHeight<40)pill.style.display='none'});
  const inp=h('input',{placeholder:'พิมพ์ข้อความ…',maxlength:'300',enterkeyhint:'send'});
  const err=h('div',{class:'err',style:'padding:0 12px'});
  let last=0,first=true;
  const send=async()=>{
    const v=inp.value.trim();if(!v)return;
    if(Date.now()-last<3000){err.textContent='รอสักครู่ก่อนส่งข้อความถัดไป';return}
    last=Date.now();err.textContent='';
    try{await addDoc(collection(db,'announcements',id,'messages'),{uid:user.uid,name:profile.name,house:profile.house,text:v,createdAt:serverTimestamp()});inp.value='';inp.focus()}
    catch(e){err.textContent=e.message}
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  const bubble=d=>{
    const m=d.data(),me=m.uid===user.uid,host=!!o.host&&m.uid===o.host;
    return h('div',{class:'bub'+(me?' me':'')+(host?' adm':'')},
      me?null:h('div',{class:'who'},m.name+' · บ้าน '+m.house+(host?' · ผู้ประกาศ':'')),
      h('div',{class:'txt'},m.text),
      h('div',{class:'t'},hhmm(m.createdAt),isAdmin()?h('button',{class:'x',onclick:()=>deleteDoc(d.ref)},'ลบ'):null));
  };
  const off=onSnapshot(query(collection(db,'announcements',id,'messages'),orderBy('createdAt','asc'),limit(200)),snap=>{
    const prev=list.scrollTop;
    const near=list.scrollHeight-list.scrollTop-list.clientHeight<80;
    const mine=snap.docs.length>0&&snap.docs[snap.docs.length-1].data().uid===user.uid;
    list.replaceChildren(...(snap.empty?[h('div',{class:'nomsg'},'ยังไม่มีข้อความ พิมพ์ได้เลย')]:snap.docs.map(bubble)));
    if(first||near||mine){list.scrollTop=list.scrollHeight;pill.style.display='none'}
    else{list.scrollTop=prev;pill.style.display=''}
    first=false;
  },e=>{list.replaceChildren(h('div',{class:'nomsg'},e.message))});
  return{off,el:h('div',{class:'chat'},list,pill,h('div',{class:'chat-in'},inp,h('button',{onclick:send},'ส่ง')),err)};
}
function chatSync(hold,cs,d){
  const id=liveOn(d)&&d.announcementId;
  if(!id){if(cs.off){cs.off();cs.off=null;cs.id=null}hold.replaceChildren();return}
  if(cs.id===id)return;
  if(cs.off)cs.off();
  const cb=chatBox(id,{host:d.startedBy});
  cs.id=id;cs.off=cb.off;
  hold.replaceChildren(h('h3',{style:'margin:14px 0 8px'},'แชทสด'),cb.el);
}

function liveAdminCard(){
  const title=h('input',{placeholder:'หัวข้อประกาศสด (ไม่บังคับ)'});
  const st=h('p',{class:'meta'},liveRoom?'🔴 ออกอากาศอยู่':'');
  const btn=h('button',{});
  let lastLive=null;
  const clear=h('button',{class:'ghost sm',style:'display:none',onclick:async()=>{await offLive();cleanupLive(lastLive?.announcementId)}},'ล้างสถานะสดที่ค้างอยู่');
  const hold=h('div'),cs={id:null,off:null},saveBox=h('div');
  const renderSave=()=>{
    saveBox.replaceChildren();
    const rc=pendingRec;if(!rc)return;
    const url=URL.createObjectURL(rc.blob),secs=Math.round(rc.ms/1000);
    const ttl=h('input',{value:title.value.trim()||'ประกาศเสียง'}),msg=h('p',{class:'meta'});
    const keep=h('button',{},'เก็บเสียงไว้'),drop=h('button',{class:'ghost'},'ไม่เก็บ');
    keep.onclick=async()=>{
      keep.disabled=drop.disabled=true;msg.textContent='กำลังบันทึกเสียง…';
      try{await saveRecording(rc,ttl.value.trim()||'ประกาศเสียง');pendingRec=null;URL.revokeObjectURL(url);
        saveBox.replaceChildren(h('p',{},'✅ เก็บเสียงแล้ว ลูกบ้านฟังย้อนหลังได้ในรายการประกาศ'))}
      catch(e){msg.textContent='บันทึกไม่สำเร็จ: '+e.message;keep.disabled=drop.disabled=false}
    };
    drop.onclick=()=>{pendingRec=null;URL.revokeObjectURL(url);saveBox.replaceChildren(h('p',{class:'meta'},'ไม่เก็บเสียง ลบทิ้งแล้ว'))};
    saveBox.append(h('div',{class:'card',style:'border:2px solid var(--amber);margin-top:12px'},
      h('h3',{},'เก็บเสียงประกาศไว้ไหม?'),
      h('p',{class:'meta'},'ความยาว '+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')+' · ฟังตรวจก่อนได้ ลูกบ้านที่พลาดจะกดฟังย้อนหลังได้'),
      h('audio',{controls:'',src:url,style:'width:100%;margin:8px 0'}),
      h('label',{},'ชื่อประกาศ'),ttl,h('div',{class:'row'},keep,drop),msg));
  };
  unsubs.push(()=>{if(cs.off)cs.off()});
  const paint=()=>{const on=!!liveRoom;btn.textContent=on?'■ จบการประกาศสด':'● เริ่มประกาศสด';btn.className=on?'danger':'';title.disabled=on};
  unsubs.push(onSnapshot(doc(db,'live','current'),x=>{
    lastLive=x.data();curLiveId=liveOn(lastLive)?lastLive.announcementId:null;
    clear.style.display=(liveOn(lastLive)&&!liveRoom)?'':'none';
    chatSync(hold,cs,lastLive);
  }));
  btn.onclick=async()=>{
    btn.disabled=true;
    try{
      if(liveRoom){
        const rc=await stopRec();await stopLive();
        if(rc){pendingRec=rc;renderSave();st.textContent='จบการประกาศแล้ว เลือกเก็บเสียงด้านล่าง (แชทสดถูกลบแล้ว)'}
        else st.textContent='จบการประกาศแล้ว (ลบแชทสดทิ้งแล้ว)';
      }
      else{
        st.textContent='กำลังเปิดไมค์ (อนุญาตไมโครโฟนเมื่อเบราว์เซอร์ถาม)…';
        const[LK,t]=await Promise.all([loadLK(),getToken('speak')]);
        const room=new LK.Room({audioCaptureDefaults:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        await room.connect(t.url,t.token);
        await room.localParticipant.setMicrophoneEnabled(true);
        liveRoom=room;startRec(room,LK);
        room.on(LK.RoomEvent.Disconnected,()=>{if(liveRoom===room){const id=liveAnnId;liveRoom=null;liveAnnId=null;offLive().catch(()=>{});cleanupLive(id);stopRec().then(rc=>{if(rc){pendingRec=rc;renderSave()}});st.textContent='การเชื่อมต่อหลุด ประกาศสดสิ้นสุด';paint()}});
        const ttl=title.value.trim()||'ประกาศสด';
        const a=await addDoc(collection(db,'announcements'),{title:ttl,text:'',level:'normal',type:'live',createdBy:user.uid,createdAt:serverTimestamp()});
        liveAnnId=a.id;
        await setDoc(doc(db,'live','current'),{active:true,title:ttl,announcementId:a.id,startedBy:user.uid,startedAt:serverTimestamp()});
        st.textContent='กำลังเชื่อมตู้ลำโพง… รอ 3 วินาที แล้วพูดได้เลย';
        setTimeout(()=>{if(liveRoom===room)st.textContent='🔴 ออกอากาศอยู่ พูดได้เลย'},3000);
      }
    }catch(e){st.textContent=(e.name==='NotAllowedError'?'ไม่ได้อนุญาตไมโครโฟน':e.message)||String(e);await stopRec();await stopLive()}
    finally{btn.disabled=false;paint()}
  };
  paint();renderSave();
  return h('div',{class:'card'},h('h3',{},'ประกาศสด'),title,btn,st,clear,
    h('p',{class:'meta'},'ถือมือถือห่างจากลำโพงตู้ หรือใช้หูฟัง เพื่อกันเสียงหอน'),
    h('button',{class:'ghost sm',onclick:showReceiver},'โหมดตัวรับ (ตู้ลำโพง)'),saveBox,hold);
}

function liveListenCard(){
  const st=h('p',{},'ตอนนี้ไม่มีประกาศสด'),btn=h('button',{style:'display:none'});
  const hold=h('div'),cs={id:null,off:null};
  unsubs.push(()=>{if(cs.off)cs.off()});
  const box=h('div',{class:'card'},h('h3',{},'ประกาศสด'),st,btn,hold,
    h('button',{class:'ghost sm',style:'margin-top:10px',onclick:showReceiver},'โหมดตัวรับ (ตู้ลำโพง)'));
  let cur=null;
  const stopListen=()=>{const r=listenRoom;listenRoom=null;try{r?.disconnect()}catch(_){}};
  const paint=()=>{
    const on=liveOn(cur);
    if(!on&&listenRoom)stopListen();
    box.style.border=on?'2px solid var(--red)':'';
    st.textContent=on?'🔴 กำลังประกาศสด: '+(cur.title||''):'ตอนนี้ไม่มีประกาศสด';
    btn.style.display=on?'':'none';
    btn.textContent=listenRoom?'หยุดฟัง':'🔊 ฟังสด';
  };
  btn.onclick=async()=>{
    btn.disabled=true;
    try{
      if(listenRoom)stopListen();
      else{
        const r=await listenConnect();listenRoom=r;
        r.on(window.LivekitClient.RoomEvent.Disconnected,()=>{if(listenRoom===r){listenRoom=null;paint()}});
      }
    }catch(e){st.textContent=e.message}
    finally{btn.disabled=false;paint()}
  };
  unsubs.push(onSnapshot(doc(db,'live','current'),x=>{cur=x.data();paint();chatSync(hold,cs,cur)},()=>{}));
  return box;
}

async function keepAwake(){try{wl=await navigator.wakeLock?.request('screen')}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&receiverOn)keepAwake()});

async function rxSync(st){
  if(!receiverOn)return;
  if(rxWant&&!rxRoom&&!rxBusy){
    rxBusy=true;st.textContent='กำลังเชื่อมต่อเสียงประกาศ…';
    try{
      const r=await listenConnect();
      if(!receiverOn||!rxWant){r.disconnect();return}
      rxRoom=r;
      r.on(window.LivekitClient.RoomEvent.Disconnected,()=>{
        if(rxRoom===r){rxRoom=null;if(receiverOn&&rxWant){st.textContent='ขาดการเชื่อมต่อ กำลังลองใหม่…';setTimeout(()=>rxSync(st),2000)}}
      });
      st.textContent='🔴 กำลังรับเสียงประกาศสด';
    }catch(e){st.textContent='เชื่อมต่อไม่สำเร็จ: '+e.message+' (ลองใหม่อัตโนมัติ)';setTimeout(()=>rxSync(st),4000)}
    finally{rxBusy=false}
  }else if(!rxWant&&rxRoom){
    const r=rxRoom;rxRoom=null;try{await r.disconnect()}catch(_){}
    st.textContent='พร้อมรับเสียง — รอประกาศสด';
  }
}
function showReceiver(){
  const subs=unsubs.slice(0,1);unsubs.forEach((u,i)=>{if(i>0)u()});unsubs=subs;
  const st=h('p',{style:'font:500 22px Kanit,sans-serif'},'แตะ “เริ่มทำงาน” เพื่อเปิดรับเสียง');
  const go=h('button',{style:'font-size:22px;padding:18px 30px'},'เริ่มทำงาน');
  show(h('div',{class:'bar'},h('h1',{},'โหมดตัวรับ'),
      h('button',{class:'ghost sm',onclick:()=>{stopRooms();history.replaceState(null,'',location.pathname);showMain()}},'‹ ออก')),
    h('div',{class:'card center'},st,go,
      h('p',{class:'meta'},'ต่อสาย AUX จากมือถือเครื่องนี้เข้าแอมป์ เปิดเสียงเครื่องให้ดังพอ แล้วเปิดหน้านี้ค้างไว้')));
  go.onclick=()=>{
    go.remove();receiverOn=true;keepAwake();
    st.textContent='พร้อมรับเสียง — รอประกาศสด';
    unsubs.push(onSnapshot(doc(db,'live','current'),x=>{rxWant=liveOn(x.data());rxSync(st)},e=>{st.textContent='อ่านสถานะไม่ได้: '+e.message}));
  };
}

async function createProfile(uid,base,code){
  try{await setDoc(doc(db,'users',uid),{...base,role:'resident',approved:true,joinCode:code,createdAt:serverTimestamp()})}
  catch(e){
    if(e.code==='permission-denied'){const x=new Error('รหัสหมู่บ้านไม่ถูกต้อง หรือยังไม่เปิดรับสมัคร');x.isCode=true;throw x}
    throw e;
  }
}

function settingsCard(){
  const on=h('input',{type:'checkbox',style:'width:auto;margin:0 10px 0 0'});
  const code=h('input',{placeholder:'ตั้งรหัสที่ลูกบ้านต้องกรอก',autocomplete:'off'});
  const msg=h('p',{class:'meta'});
  getDoc(doc(db,'settings','app')).then(x=>{if(x.exists()){on.checked=!!x.data().autoApprove;code.value=x.data().joinCode||''}}).catch(()=>{});
  return h('div',{class:'card'},h('h3',{},'การรับสมาชิก'),
    h('label',{style:'display:flex;align-items:center;margin:10px 0'},on,'เปิดรับสมัครด้วยรหัสหมู่บ้าน'),
    h('label',{},'รหัสหมู่บ้าน (บอกลูกบ้านเอง)'),code,
    h('button',{class:'sm',onclick:async()=>{
      if(on.checked&&!code.value.trim()){msg.textContent='กรุณาตั้งรหัสหมู่บ้านก่อน';return}
      try{await setDoc(doc(db,'settings','app'),{autoApprove:on.checked,joinCode:code.value.trim()});msg.textContent='บันทึกแล้ว'}
      catch(e){msg.textContent='บันทึกไม่สำเร็จ: '+e.message}
    }},'บันทึก'),msg);
}

function showSignup(){
  const name=h('input',{autocomplete:'name'}),house=h('input',{placeholder:'เช่น 12/3'}),
    phone=h('input',{type:'tel',inputmode:'numeric',autocomplete:'username'}),
    pwf=pwField('new-password','ตัวอักษรหรือตัวเลข 6 ตัว',6),pw=pwf.input,
    pwf2=pwField('new-password','พิมพ์รหัสผ่านอีกครั้ง',6),pw2=pwf2.input;
  const code=h('input',{placeholder:'ถามผู้ใหญ่บ้าน',autocomplete:'off'});
  const err=h('p',{class:'err'});
  show(h('div',{class:'bar'},h('h1',{},'สมัครเป็นลูกบ้าน'),h('button',{class:'ghost sm',onclick:showLogin},'‹ กลับ')),
    h('div',{class:'card'},
      h('label',{},'ชื่อ-นามสกุล'),name,h('label',{},'บ้านเลขที่'),house,
      h('label',{},'เบอร์โทร (ใช้เป็นชื่อผู้ใช้)'),phone,
      h('label',{},'ตั้งรหัสผ่าน (6 ตัวพอดี)'),pwf.row,h('label',{},'ยืนยันรหัสผ่าน'),pwf2.row,
      h('label',{},'รหัสหมู่บ้าน'),code,
      h('button',{onclick:async()=>{
        if(!name.value.trim()||!house.value.trim()){err.textContent='กรุณากรอกชื่อและบ้านเลขที่';return}
        if(!code.value.trim()){err.textContent='กรุณากรอกรหัสหมู่บ้าน';return}
        if(!okPhone(phone.value)){err.textContent='เบอร์โทรต้องขึ้นต้นด้วย 0 และมี 9–10 หลัก';return}
        if(pw.value.length!==6){err.textContent='รหัสผ่านต้องมี 6 ตัวพอดี';return}
        if(pw.value!==pw2.value){err.textContent='รหัสผ่านสองช่องไม่ตรงกัน';return}
        signingUp=true;
        try{
          const c=await createUserWithEmailAndPassword(auth,toEmail(phone.value),pw.value);
          user=c.user;
          await createProfile(user.uid,{name:name.value.trim(),house:house.value.trim(),phone:phone.value.replace(/\D/g,''),email:''},code.value.trim());
          signingUp=false;watchProfile();
        }catch(e){
          err.textContent=e.isCode?e.message:authMsg(e);
          if(auth.currentUser){try{await auth.currentUser.delete()}catch(_){await signOut(auth).catch(()=>{})}}
          user=null;setTimeout(()=>{signingUp=false},800);
        }
      }},'ส่งคำขอสมัคร'),err));
}

function showRegister(){
  const name=h('input',{value:user.displayName||'',autocomplete:'name'});
  const house=h('input',{placeholder:'เช่น 12/3'});
  const phone=h('input',{type:'tel',autocomplete:'tel'});
  const code=h('input',{placeholder:'ถามผู้ใหญ่บ้าน',autocomplete:'off'});
  const err=h('p',{class:'err'});
  show(h('div',{class:'bar'},h('h1',{},'สมัครเป็นลูกบ้าน'),logoutBtn()),
    h('div',{class:'card'},
      h('label',{},'ชื่อ-นามสกุล'),name,
      h('label',{},'บ้านเลขที่'),house,
      h('label',{},'เบอร์โทร'),phone,
      h('label',{},'รหัสหมู่บ้าน'),code,
      h('button',{onclick:async()=>{
        if(!name.value.trim()||!house.value.trim()){err.textContent='กรุณากรอกชื่อและบ้านเลขที่';return}
        if(!code.value.trim()){err.textContent='กรุณากรอกรหัสหมู่บ้าน';return}
        try{
          await createProfile(user.uid,{name:name.value.trim(),house:house.value.trim(),phone:phone.value.trim(),email:user.email||''},code.value.trim());
          watchProfile();
        }catch(e){err.textContent=e.message}
      }},'ส่งคำขอสมัคร'),err));
}

function watchProfile(){
  clean();
  unsubs.push(onSnapshot(doc(db,'users',user.uid),s=>{
    if(!s.exists())return showRegister();
    profile=s.data();
    if(!profile.approved)return showPending();
    if(!root.dataset.main){root.dataset.main='1';location.hash==='#receiver'?showReceiver():showMain()}
  },showError));
}

function showPending(){
  delete root.dataset.main;
  show(h('div',{class:'card center'},h('h2',{},'รอผู้ดูแลอนุมัติ'),
    h('p',{},'ส่งคำขอแล้ว เมื่อผู้ดูแลอนุมัติ หน้านี้จะเปลี่ยนให้อัตโนมัติ'),logoutBtn()));
}

function showMain(tab='news'){
  const subs=unsubs.slice(0,1);unsubs.forEach((u,i)=>{if(i>0)u()});unsubs=subs;
  const list=h('div'),body=h('div');
  const tabs=h('div',{class:'tabs'},
    h('button',{class:tab==='news'?'':'ghost',onclick:()=>showMain('news')},'ประกาศ'),
    isAdmin()?h('button',{class:tab==='members'?'':'ghost',onclick:()=>showMain('members')},'สมาชิก'):null);
  show(h('div',{class:'bar'},h('div',{},h('h1',{},'ประกาศหมู่บ้าน'),h('div',{class:'who'},profile.name+' · บ้าน '+profile.house)),logoutBtn()),
    tabs,body);
  if(tab==='members')return renderMembers(body);
  body.append(isAdmin()?liveAdminCard():liveListenCard());
  if(isAdmin())body.append(composer());
  body.append(list);
  unsubs.push(onSnapshot(query(collection(db,'announcements'),orderBy('createdAt','desc'),limit(30)),snap=>{
    if(isAdmin()&&!liveRoom)snap.docs.forEach(d=>{const a=d.data();
      if(a.type==='live'&&d.id!==liveAnnId&&d.id!==curLiveId&&a.createdAt?.toDate&&Date.now()-a.createdAt.toDate().getTime()>120000)cleanupLive(d.id)});
    const docs=snap.docs.filter(d=>d.data().type!=='live');
    if(!docs.length){list.replaceChildren(h('p',{class:'center meta'},'ยังไม่มีประกาศ'));return}
    list.replaceChildren(...docs.map(d=>{const a=d.data();
      return h('div',{class:'card item '+a.level,onclick:()=>showThread(d.id,a)},
        h('span',{class:'tag '+a.level},LV[a.level]||'ทั่วไป'),a.type==='audio'?h('span',{class:'tag'},'🎧 เสียงบันทึก'):null,h('h3',{},a.title),
        h('div',{},a.text),h('div',{class:'meta'},when(a.createdAt)+' · แตะเพื่อถามหรือตอบ'),a.type==='audio'?audioPlayer(d.id,a):null,isAdmin()?h('button',{class:'ghost sm',style:'margin-top:8px',onclick:e=>{e.stopPropagation();if(confirm('ลบประกาศนี้ทิ้งถาวร?'))removeAnn(d.id,a.audioParts||0)}},'ลบ'):null)}));
  },showError));
}

function composer(){
  const t=h('input',{placeholder:'หัวข้อ'});
  const x=h('textarea',{rows:3,placeholder:'รายละเอียด'});
  const l=h('select',{},...Object.entries(LV).map(([k,v])=>h('option',{value:k},v)));
  const err=h('p',{class:'err'});
  return h('div',{class:'card'},h('h3',{},'สร้างประกาศ'),t,x,l,
    h('button',{onclick:async()=>{
      if(!t.value.trim()){err.textContent='กรุณากรอกหัวข้อ';return}
      try{await addDoc(collection(db,'announcements'),{title:t.value.trim(),text:x.value.trim(),level:l.value,type:'text',createdBy:user.uid,createdAt:serverTimestamp()});
        t.value='';x.value='';err.textContent=''}catch(e){err.textContent=e.message}
    }},'ประกาศ'),err);
}

function renderMembers(body){
  const list=h('div');
  body.append(settingsCard(),list);
  unsubs.push(onSnapshot(query(collection(db,'users'),where('approved','==',false)),snap=>{
    if(snap.empty){list.replaceChildren(h('p',{class:'center meta'},'ไม่มีคำขอที่รออนุมัติ'));return}
    list.replaceChildren(...snap.docs.map(d=>{const u=d.data();
      return h('div',{class:'card'},h('h3',{},u.name),h('div',{class:'meta'},'บ้าน '+u.house+' · '+(u.phone||'ไม่ระบุเบอร์')+' · '+(u.email||'')),
        h('div',{class:'row',style:'margin-top:10px'},
          h('button',{class:'sm',onclick:()=>updateDoc(doc(db,'users',d.id),{approved:true})},'อนุมัติ'),
          h('button',{class:'sm danger',onclick:()=>{if(confirm('ลบคำขอของ '+u.name+' ?'))deleteDoc(doc(db,'users',d.id))}},'ลบ')))}));
  },showError));
}

function showThread(id,a){
  const subs=unsubs.slice(0,1);unsubs.forEach((u,i)=>{if(i>0)u()});unsubs=subs;
  const cb=chatBox(id);unsubs.push(cb.off);
  show(h('div',{class:'bar'},h('button',{class:'ghost sm',onclick:()=>showMain()},'‹ กลับ'),logoutBtn()),
    h('div',{class:'card item '+a.level},h('span',{class:'tag '+a.level},LV[a.level]||'ทั่วไป'),h('h3',{},a.title),h('div',{},a.text),h('div',{class:'meta'},when(a.createdAt))),
    h('h3',{style:'margin:14px 0 8px'},'ถาม-ตอบ'),cb.el);
}
</script>
